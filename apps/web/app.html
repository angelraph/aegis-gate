<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aegis Gate Deals</title>
<meta name="theme-color" content="#0a0b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="modulepreload" href="/signer-client.js">
<link rel="modulepreload" href="/protocol.js">
<link rel="modulepreload" href="/signer/aegis_signer.js">
<link rel="icon" href="/brand/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/mark.svg">
<meta property="og:image" content="/brand/logo.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body data-space="seller">

<nav class="nav" aria-label="Main">
  <a class="brand" href="/">
    <img class="brand-mark" src="/brand/mark.svg" alt="" width="28" height="28">
    <span>Aegis <span class="gold">Gate</span></span>
  </a>
  <div class="nav-links">
    <span class="engine-dot" id="engineState" data-state="checking">Engine…</span>
    <a href="/docs.html">Docs</a>
    <a href="/faq.html">FAQ</a>
    <button class="btn primary sm" id="newBtn" type="button">New escrow <kbd>⌘K</kbd></button>
  </div>
</nav>

<main class="app" id="view" aria-live="polite"><p class="muted">Loading…</p></main>
<div class="dock" id="dock" hidden></div>

<template id="tpl-sheet">
  <div class="sheet-backdrop" id="sheet" role="dialog" aria-modal="true" aria-labelledby="f-title-label">
    <form class="sheet glass" id="newForm" novalidate>
      <div class="sheet-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="color:var(--ink-3)"><path d="M12 5v14M5 12h14"/></svg>
        <label class="sr" for="f-title" id="f-title-label">What are you selling?</label>
        <input id="f-title" name="title" maxlength="120" placeholder="What are you selling?" autocomplete="off" required>
        <kbd>esc</kbd>
      </div>
      <div class="sheet-body">
        <fieldset class="net-choice">
          <legend class="sr">Network</legend>
          <label><input type="radio" name="network" value="test" checked><span><b>Testnet</b><small>Free test coins. Try everything safely.</small></span></label>
          <label><input type="radio" name="network" value="main"><span><b>Mainnet <i>beta</i></b><small>Real ZEC. Price from 0.0002 to 0.00045 ZEC (about $0.26 to $0.60).</small></span></label>
        </fieldset>
        <div class="grid-2">
          <div class="field"><label for="f-price">Price in ZEC</label><input id="f-price" name="priceZec" inputmode="decimal" placeholder="0.02 (min 0.0002)" required></div>
          <div class="field"><label for="f-addr">Your payout address</label><input id="f-addr" name="sellerAddress" class="mono" placeholder="utest1… (testnet, shielded)" autocomplete="off" required></div>
        </div>
        <div class="field"><label for="f-terms">Terms the buyer agrees to</label><textarea id="f-terms" name="terms" rows="2" maxlength="2000" placeholder="Ships within 3 days. Buyer confirms delivery to release payment."></textarea></div>
        <label class="self-opt" for="f-self"><input type="checkbox" id="f-self" name="selfCustody" checked>
          <span><b>Keep my key in this browser</b><small>Your key share is made and stored on this device. Aegis holds only the arbiter's share. Recommended.</small></span></label>
        <p class="hint">Need testnet coins? <a href="https://faucet.testnet.valargroup.dev" target="_blank" rel="noopener">Get free TAZ</a>.</p>
        <p class="error" id="newError" hidden></p>
      </div>
      <div class="sheet-foot">
        <span class="faint" style="font-size:.82rem">You're the seller. The buyer gets their own link.</span>
        <div class="row-actions"><button class="btn ghost" type="button" id="sheetCancel">Cancel</button><button class="btn space" id="newSubmit" type="submit">Create escrow <kbd>↵</kbd></button></div>
      </div>
    </form>
  </div>
</template>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const view = $("#view"), dock = $("#dock");
  const params = new URLSearchParams(location.search);
  const ZATS = 1e8;
  let ENGINE = null, pollTimer = null, current = null;

  const STATUS = {
    setting_up: ["Making keys", "wait"], awaiting_funds: ["Waiting for payment", "wait"], funded: ["Funded", "ok"],
    disputed: ["In dispute", "warn"], paying_out: ["Paying out", "wait"], released: ["Released", "ok"], refunded: ["Refunded", "ok"],
    setup_failed: ["Setup interrupted", "warn"], signing: ["Signing", "wait"],
  };
  const ROLE = { buyer: "Buyer", seller: "Seller", arbiter: "Arbiter" };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const zec = (z) => (z / ZATS).toLocaleString("en-US", { maximumFractionDigits: 8 });
  const tq = () => encodeURIComponent(params.get("t"));

  function toast(msg) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
    document.body.append(t); setTimeout(() => t.remove(), 2200);
  }

  // ---------- engine ----------
  async function engineUrl(force) {
    if (ENGINE && !force) return ENGINE;
    if (["localhost", "127.0.0.1"].includes(location.hostname)) {
      // Local development only: ?engine=8788 points at a test engine.
      const port = new URLSearchParams(location.search).get("engine") || sessionStorage.getItem("aegis-engine-port") || "8787";
      try { sessionStorage.setItem("aegis-engine-port", port); } catch {}
      return (ENGINE = `http://127.0.0.1:${port}`);
    }
    const r = await fetch("/engine.json?ts=" + Date.now(), { cache: "no-store" });
    return (ENGINE = (await r.json()).url.replace(/\/$/, ""));
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  // Retries network failures (not API errors) and re-reads the engine address in case it moved.
  async function api(path, opts = {}, tries = 4) {
    for (let k = 0; ; k++) {
      let r;
      try {
        const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 45000);
        r = await fetch((await engineUrl(k > 0)) + path, { ...opts, signal: ctl.signal, headers: { "content-type": "application/json" } });
        clearTimeout(to);
      } catch (e) {
        if (k + 1 >= tries) throw new Error("Can't reach the escrow engine right now. Your funds are safe; this page keeps retrying.");
        await sleep(800 * 2 ** k); continue;
      }
      if (r.status >= 502 && r.status <= 504 && k + 1 < tries) { await sleep(800 * 2 ** k); continue; }
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || `The escrow engine answered ${r.status}.`);
      return body;
    }
  }
  async function checkEngine() {
    const el = $("#engineState");
    try { await api("/api/health", {}, 5); el.dataset.state = "up"; el.textContent = "Engine online"; return true; }
    catch { el.dataset.state = "down"; el.textContent = "Reconnecting…"; return false; }
  }

  function wireCopy(root = view) {
    root.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); toast("Copied"); }
      catch { toast("Copy blocked. Select the text instead."); }
    }));
  }
  const copyBtn = (text, label = "Copy") => `<button class="btn sm" type="button" data-copy="${esc(text)}">${label}</button>`;
  const dealLink = (id, t) => `${location.origin}/app.html?id=${id}&t=${encodeURIComponent(t)}`;

  // ---------- browser signer (self-custody deals) ----------
  let signer = null;
  const useSigner = async () => (signer ??= await import("/signer-client.js"));
  let ceremonyTimer = null, signTimer = null;

  async function runCeremony(d) {
    clearTimeout(ceremonyTimer);
    const s = await useSigner();
    const el = $("#ceremony");
    const say = (t) => { if (el) el.textContent = t; };
    try {
      const st = await s.ceremonyStep(api, d.id, d.role, tq());
      const words = {
        round1: "Your key share is being created in this browser…",
        round2: "Exchanging sealed messages with the other two keys…",
        "waiting-others": d.role === "seller" && !(d.keys && d.keys.boxKeys && d.keys.boxKeys.buyer) ? "Waiting for the buyer to open their link. Their key is made in their browser." : "Waiting for the other party's browser to finish its step…",
        ready: "Your key share is ready and stored in this browser.",
      };
      say(words[st] || st);
      if (st !== "ready" || d.status === "setting_up") ceremonyTimer = setTimeout(() => load(false), 3000);
    } catch (x) { say(x.message); ceremonyTimer = setTimeout(() => load(false), 6000); }
  }

  async function runSigning(d) {
    clearTimeout(signTimer);
    const s = await useSigner();
    const el = $("#signState");
    const sg = d.signing;
    const expected = d.payoutAddresses && d.payoutAddresses[sg.action === "release" ? "seller" : "buyer"];
    try {
      if (el) el.textContent = "Checking the transaction on this device…";
      const res = await s.signStep(api, d.id, d.role, tq(), sg, expected, d.network || "test");
      const v = res.review;
      const ver = $("#verified");
      if (v && ver) {
        ver.hidden = false;
        ver.innerHTML = `<b>Verified on this device</b><span>Pays <b>${zec(v.payout)} ZEC</b> to the agreed address · network fee ${zec(v.review.fee)} ZEC · from this deal's escrow · every output matches its on-chain commitment</span>`;
      }
      if (res.state === "busy") return; // a check is already running for this page
      if (el) el.textContent = { committed: "Checked and signed round one. Waiting for the other signer…", signed: "You signed. Broadcasting when both signatures are in…", "waiting-others": "Waiting for the other signer…" }[res.state] || "";
      if (res.state === "committed") signTimer = setTimeout(() => load(false), 1500);
    } catch (x) {
      if (el) { el.textContent = x.message; el.classList.add("error"); }
      const rs = $("#restartSigning"); if (rs) rs.hidden = false;
    }
  }

  async function restartSigning(d) {
    try { renderDeal(await api(`/api/deals/${d.id}/reset-signing?t=${tq()}`, { method: "POST" })); toast("Signing restarted. Approve again to sign fresh."); }
    catch (x) { toast(x.message); }
  }

  const CLOSED = ["released", "refunded"];

  function selfCustodyBlocks(d) {
    if (d.mode !== "self" || d.role === "arbiter" || CLOSED.includes(d.status)) return "";
    const mine = signer && signer.hasKey(d.id, d.role);
    const pending = signer && signer.inProgress(d.id, d.role);
    let html = "";
    if (d.status === "setting_up") {
      html += `<section class="glass block"><span class="eyebrow space">Key ceremony</span><h2 class="h-md">Making your key in this browser</h2>
        <p class="muted">Three parties (your browser, the other person's browser, and the arbiter) each make one share of the escrow key. Secret messages between them are sealed end to end; Aegis relays them without being able to read them.</p>
        <p class="ceremony" id="ceremony">Starting…</p></section>`;
    } else if (mine) {
      const other = d.role === "buyer" ? "seller" : "buyer";
      html += `<section class="glass block code-card"><span class="eyebrow space">Security code</span>
        <h2 class="h-md">${d.status === "awaiting_funds" && d.role === "buyer" ? "Before you pay, compare this code with the " + other : "Your deal security code"}</h2>
        <p class="deal-code" id="dealCode">…</p>
        <p class="muted">Read it to the ${other} on a call, or compare it in a message. It must match on both screens. If it doesn't, someone tampered with the key setup: don't pay into this escrow.</p>
        <p class="error" id="codeWarn" hidden></p></section>`;
      html += `<section class="glass block"><div class="mykey"><span class="mykey-dot"></span><div><h2 class="h-sm">Your key share is in this browser</h2><p class="muted">Aegis can't sign for you. Keep a backup in case this browser's data is cleared.</p></div></div>
        <div class="row-actions"><button class="btn" type="button" id="backupKey">Download backup</button></div></section>`;
    } else if (!pending) {
      html += `<section class="glass block"><h2 class="h-sm">This browser doesn't hold your key</h2><p class="muted">Open your link on the device you used for this deal, or restore your backup file.</p>
        <label class="btn" for="restoreKey">Restore from backup</label><input type="file" id="restoreKey" accept="application/json,.json" hidden><p class="error" id="restoreErr" hidden></p></section>`;
    }
    if (d.status === "signing" && d.signing && d.signing.mine) {
      const sg = d.signing;
      const amount = sg.amountZats != null ? `${zec(sg.amountZats)} ZEC` : "the full escrow balance, minus the network fee";
      html += `<section class="glass decide"><span class="eyebrow space">Your signature</span><h2 class="h-md">Pay ${amount}</h2>
        <p class="muted">To the ${sg.action === "release" ? "seller" : "buyer"}'s payout address:</p><code class="txid">${esc(sg.to)}</code>
        <p class="verified" id="verified" hidden></p>
        <p class="hint">Before signing, your browser fetches the transaction itself, rebuilds the escrow from your own key, and checks every output against its on-chain commitment. Keep this page open until both signatures are in.</p>
        <p class="ceremony" id="signState">Checking the request…</p>
        <button class="btn sm" type="button" id="restartSigning" hidden>Restart signing</button></section>`;
    }
    return html;
  }

  // ---------- composer (⌘K) ----------
  function openSheet() {
    if ($("#sheet")) return;
    document.body.append($("#tpl-sheet").content.cloneNode(true));
    const sheet = $("#sheet"), form = $("#newForm");
    const close = () => sheet.remove();
    $("#f-title").focus();
    form.querySelectorAll('input[name="network"]').forEach((r) => r.addEventListener("change", () => {
      const main = form.network.value === "main";
      $("#f-addr").placeholder = main ? "u1… (mainnet, shielded)" : "utest1… (testnet, shielded)";
      $("#f-price").placeholder = main ? "0.0002 to 0.00045" : "0.02 (min 0.0002)";
      document.body.dataset.net = main ? "main" : "test";
    }));
    $("#sheetCancel").addEventListener("click", close);
    sheet.addEventListener("click", (e) => { if (e.target === sheet) close(); });
    sheet.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(form), err = $("#newError"), btn = $("#newSubmit");
      err.hidden = true; btn.disabled = true; btn.textContent = "Creating escrow…";
      try {
        const r = await api("/api/deals", { method: "POST", body: JSON.stringify({
          title: f.get("title"), priceZec: Number(String(f.get("priceZec")).replace(",", ".")), terms: f.get("terms"), sellerAddress: f.get("sellerAddress"), selfCustody: f.get("selfCustody") === "on", network: f.get("network") === "main" ? "main" : "test",
        }) });
        close();
        history.pushState(null, "", `/app.html?id=${r.id}&t=${encodeURIComponent(r.seller)}&new=1`);
        route();
      } catch (x) { err.textContent = x.message; err.hidden = false; btn.disabled = false; btn.innerHTML = "Create escrow <kbd>↵</kbd>"; }
    });
  }
  $("#newBtn").addEventListener("click", openSheet);
  addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSheet(); } });

  // ---------- deal space ----------
  function track(s) {
    const order = ["setting_up", "awaiting_funds", "funded", "settled"];
    const stage = ["released", "refunded"].includes(s) ? 4 : s === "paying_out" || s === "disputed" ? 3 : order.indexOf(s) + 1;
    const items = [["Keys made", "3 shares, 1 key"], ["Paid in", "held shielded"], ["Confirmed", "both sides agree"], [s === "refunded" ? "Refunded" : "Released", "2 of 3 signed"]];
    return `<ol class="track" aria-label="Deal progress">${items.map(([b, t], i) => `<li data-done="${i + 1 < stage || stage === 4}" data-now="${i + 1 === stage && stage !== 4}"><span class="bar"></span><b>${b}</b><span>${t}</span></li>`).join("")}</ol>`;
  }

  function keysPanel(d) {
    const signedBy = new Set(Object.keys(d.approvals || {}));
    const last = (d.txs || []).at(-1);
    if (last) last.signers.forEach((s) => signedBy.add(s));
    const rows = [["buyer", "B", "Paid in, confirms delivery"], ["seller", "S", "Ships, gets paid"], ["arbiter", "A", "Decides disputes only"]];
    return `<section class="glass block" aria-labelledby="keys-h"><h2 class="h-sm" id="keys-h">The three keys</h2><div class="keys">${rows.map(([r, l, sub]) => {
      const act = (d.approvals || {})[r];
      const state = act ? `approved ${act}` : last && last.signers.includes(r) ? "signed" : "holding";
      return `<div class="key" style="--c:var(--${r})" data-signed="${signedBy.has(r)}" data-me="${d.role === r}"><span class="dot">${l}</span><span><b>${ROLE[r]}</b><small>${sub}</small></span><span class="state">${state}</span></div>`;
    }).join("")}</div><p class="hint">Any two matching approvals move the money. One alone can't.</p></section>`;
  }

  function decisions(d) {
    const r = d.role, s = d.status, a = d.approvals || {}, mine = a[r];
    const confirming = d.balance && d.balance.total > 0 && d.balance.spendable < d.balance.total;
    const opts = [];
    if (s === "funded") {
      if (r === "buyer") {
        opts.push(["release", "Confirm delivery and release", "space"]);
        if (a.seller === "refund") opts.push(["refund", "Accept the seller's refund", ""]);
        opts.push(["dispute", "Open a dispute", "ghost"]);
      }
      if (r === "seller") {
        opts.push(["release", "Approve release", "space"]);
        opts.push(["refund", "Refund the buyer", ""]);
        opts.push(["dispute", "Open a dispute", "ghost"]);
      }
    }
    if (s === "disputed") {
      if (r === "arbiter") { opts.push(["release", "Rule for the seller", "space"]); opts.push(["refund", "Rule for the buyer", ""]); }
      else opts.push([r === "buyer" ? "refund" : "release", r === "buyer" ? "Ask for my refund" : "Ask for my payment", "space"]);
    }
    const btns = opts.map(([act, label, cls]) => `<button class="btn ${cls}" data-act="${act}" ${mine === act || confirming ? "disabled" : ""}>${mine === act ? "You approved this" : label}</button>`);
    return { btns, confirming };
  }

  // ---------- newcomer onboarding: zero to a first shielded payment ----------
  const backedUpKey = (d) => { try { return localStorage.getItem(`aegis-gate:backup:${d.id}:${d.role}`) === "1"; } catch { return false; } };
  const markBackedUp = (d) => { try { localStorage.setItem(`aegis-gate:backup:${d.id}:${d.role}`, "1"); } catch {} };
  const stepDone = (d, k) => { try { return localStorage.getItem(`aegis-gate:onboard:${d.id}:${k}`) === "1"; } catch { return false; } };
  const markStep = (d, k, v) => { try { localStorage.setItem(`aegis-gate:onboard:${d.id}:${k}`, v ? "1" : "0"); } catch {} };

  function onboarding(d) {
    if (d.role !== "buyer" || d.status !== "awaiting_funds") return "";
    const main = d.network === "main";
    const selfMode = d.mode === "self";
    const keySafe = !selfMode || backedUpKey(d);
    const steps = [
      { k: "wallet", title: "Get a shielded Zcash wallet",
        body: main
          ? `Install <a href="https://zodl.com" target="_blank" rel="noopener">Zodl</a> (formerly Zashi) or another wallet that supports the Ironwood pool. Write down its recovery phrase and keep it offline.`
          : `Use a wallet that supports Zcash <b>testnet</b> and the Ironwood pool. Testnet coins are free and worthless, so this is the safe place to learn.` },
      selfMode ? { k: "backup", title: "Back up your Aegis key", locked: !backedUpKey(d), auto: true,
        body: `Your key for this deal lives only in this browser. Save the backup file somewhere safe before any money goes in. <button class="btn sm" type="button" id="onboardBackup">${backedUpKey(d) ? "Backup saved ✓" : "Download backup"}</button>` } : null,
      { k: "get", title: main ? "Get a little ZEC" : "Get free test ZEC",
        body: main
          ? `Buy ZEC on an exchange or swap into ZEC in your wallet. This deal needs <b>${Number(d.priceZec)} ZEC</b> plus about 0.0001 ZEC for the network fee.`
          : `Paste your wallet's address into the <a href="https://faucet.testnet.valargroup.dev" target="_blank" rel="noopener">testnet faucet</a>. It sends 0.125 TAZ, enough for this deal.` },
      { k: "shield", title: "Make sure it's shielded",
        body: `Shielded ZEC hides who paid whom and how much. Coins from an exchange often arrive <i>transparent</i> (an address starting with <code>t</code>). Tap <b>Shield</b> in your wallet first: the escrow accepts shielded payments only, so your first shielded transaction happens here.` },
      { k: "pay", title: "Pay into the escrow", body: keySafe ? `Scan the QR code or tap <b>Open in wallet</b>. Your payment is held, shielded, until two of three people sign.` : `Finish the backup step to see the payment details.` },
    ].filter(Boolean);
    const done = (s) => s.auto ? !s.locked : s.k === "pay" ? false : stepDone(d, s.k);
    const count = steps.filter(done).length;
    return `<section class="glass block onboard-flow" aria-labelledby="ob-h">
      <div class="ob-head"><span class="eyebrow space">New to Zcash?</span><span class="ob-count">${count}/${steps.length - 1} ready</span></div>
      <h2 class="h-md" id="ob-h">Your first shielded payment</h2>
      <ol class="ob-steps">${steps.map((s, i) => `<li data-done="${done(s)}">
        <label class="ob-check">${s.k === "pay" || s.auto ? `<span class="ob-num">${i + 1}</span>` : `<input type="checkbox" data-step="${s.k}" ${done(s) ? "checked" : ""} aria-label="Mark step ${i + 1} done"><span class="ob-num">${i + 1}</span>`}</label>
        <div><b>${s.title}</b><p>${s.body}</p></div></li>`).join("")}</ol>
      <p class="hint">After the deal settles, the payout lands shielded too. To move ZEC to an exchange that needs a transparent address, send it from your wallet to that <code>t…</code> address: that's unshielding.</p>
    </section>`;
  }

  function renderDeal(d, fresh) {
    current = d;
    const closed = CLOSED.includes(d.status);
    document.body.dataset.space = d.role;
    const [statusText, tone] = STATUS[d.status] || [d.status, "wait"];
    const price = Number(d.priceZec);
    const needAddr = (d.role === "buyer" && !d.addresses.buyer) || (d.role === "seller" && !d.addresses.seller);
    const { btns, confirming } = decisions(d);
    const balTotal = d.balance ? d.balance.total : 0;
    const balState = !d.balance ? "not checked yet" : balTotal === 0 ? "nothing yet" : confirming ? "confirming · about 10 blocks" : "confirmed";
    const payTitle = d.role === "buyer" && d.status === "awaiting_funds" ? "Pay into the escrow" : "The escrow";

    view.innerHTML = `
      <section class="glass space-head">
        <div class="space-top"><span class="role-badge"><i>${ROLE[d.role][0]}</i>You're the ${ROLE[d.role].toLowerCase()}</span><span class="status" data-tone="${tone}">${statusText}</span></div>
        <div class="deal-title"><span class="eyebrow">Deal ${esc(d.id)} · ${d.network === "main" ? '<b class="net-main">Zcash mainnet · beta</b>' : "Zcash testnet"}</span><h1 class="h-lg">${esc(d.title)}</h1>
          <p class="price">${price.toLocaleString("en-US", { maximumFractionDigits: 8 })}<small>ZEC</small></p>
          ${d.terms ? `<p class="terms">${esc(d.terms)}</p>` : ""}</div>
        ${track(d.status)}
      </section>

      ${d.invite && (fresh || ["setting_up", "awaiting_funds"].includes(d.status)) ? `<section class="glass block" style="--space:var(--buyer)"><span class="eyebrow space">Next step</span><h2 class="h-md">Send this link to your buyer</h2>
        <p class="muted">It's their private way into the deal: they pay, track and approve from it. Anyone holding it acts as the buyer, so send it directly.</p>
        <div class="keyline"><code>${esc(dealLink(d.id, d.invite.buyer))}</code>${copyBtn(dealLink(d.id, d.invite.buyer), "Copy link")}</div>
        <p class="hint">This page is your seller link. Bookmark it. <b>Trying Aegis alone?</b> Open the buyer link in another tab or on your phone and play both sides.</p></section>` : ""}

      <div class="cols">
        <div class="col">
          ${selfCustodyBlocks(d)}
          ${d.status === "setting_up" && d.mode !== "self" ? `<section class="glass block"><h2 class="h-sm">Making the three keys</h2><p class="muted">Buyer, seller and arbiter shares are being created in a FROST key ceremony. About a minute.</p><pre class="log" id="jobLog">Starting…</pre></section>` : ""}
          ${d.escrow && closed ? `<section class="glass block"><span class="eyebrow space">Settled</span>
              <h2 class="h-md">${d.status === "released" ? "Paid to the seller" : "Refunded to the buyer"}</h2>
              <p class="muted">The escrow paid out its balance, minus the network fee, shielded the whole way. Nothing more can move; this deal is closed.</p>
              <div class="keyline"><code>${esc(d.escrow.address)}</code>${copyBtn(d.escrow.address)}</div>
            </section>` : ""}
          ${d.escrow && !closed ? `<section class="glass block"><div class="pay">
              <div class="qr" id="qr" role="img" aria-label="Payment QR code"></div>
              <div class="stack-sm" style="display:grid;gap:10px;min-width:0">
                <h2 class="h-md">${payTitle}</h2>
                <p class="muted">${d.role === "buyer" && d.status === "awaiting_funds" ? `Scan with your wallet, or copy the address, and send exactly ${price} ZEC.` : "A shielded Ironwood address. Only two of the three keys together can move it."}</p>
                <div class="amount-row"><b>${zec(balTotal)} ZEC</b><span class="faint">${balState}</span><button class="btn sm" id="refresh">Check now</button></div>
                ${d.status === "awaiting_funds" && d.role === "buyer" && d.mode === "self" && !backedUpKey(d) ? `<p class="gate">Back up your Aegis key first (step 2 below). Payment details appear right after.</p>` : ""}
                ${d.status === "awaiting_funds" && !(d.role === "buyer" && d.mode === "self" && !backedUpKey(d)) ? `<div class="row-actions"><a class="btn space" href="zcash:${esc(d.escrow.address)}?amount=${price}&amp;message=${encodeURIComponent("Aegis Gate: " + d.title)}">Open in wallet</a>${copyBtn(`zcash:${d.escrow.address}?amount=${price}`, "Copy payment link")}</div>` : ""}
              </div></div>
              <div class="keyline"><code>${esc(d.escrow.address)}</code>${copyBtn(d.escrow.address)}</div>
            </section>` : ""}
          ${onboarding(d)}
          ${needAddr && !closed ? `<section class="glass block"><h2 class="h-sm">${d.role === "buyer" ? "Where should a refund go?" : "Where should your payment go?"}</h2>
            <form class="keyline" id="addrForm"><label class="sr" for="f-myaddr">Shielded address</label><input class="input mono" id="f-myaddr" placeholder="Paste your wallet's ${d.network === "main" ? "u1" : "utest1"}… address" required><div class="row-actions"><button class="btn" type="button" id="pasteAddr">Paste</button><button class="btn space">Save</button></div></form>
            <p class="error" id="addrError" hidden></p></section>` : ""}
          ${d.txs && d.txs.length ? `<section class="glass block"><h2 class="h-sm">On-chain record</h2>${d.txs.map((t) => `<div class="tx"><div class="tx-head"><b>${t.action === "release" ? "Released to seller" : "Refunded to buyer"}</b><span class="faint">signed by ${t.signers.map((s) => ROLE[s]).join(" + ")}</span></div><code class="txid">${esc(t.txid || "pending")}</code></div>`).join("")}</section>` : ""}
          ${d.escrow ? `<details class="glass block"><summary>Audit this escrow</summary><p class="muted">The viewing key shows the escrow's activity in any Ironwood ${d.network === "main" ? "mainnet" : "testnet"} wallet. It can never spend.</p><div class="keyline"><code>${esc(d.escrow.ufvk)}</code>${copyBtn(d.escrow.ufvk)}</div></details>` : ""}
        </div>
        <div class="col">
          ${["funded", "disputed"].includes(d.status) ? `<section class="glass decide"><span class="eyebrow space">${d.status === "disputed" ? "Dispute" : "Your call"}</span>
            <h2 class="h-md">${d.status === "disputed" ? (d.role === "arbiter" ? "Review and decide" : "The arbiter is reviewing") : "Settle the deal"}</h2>
            <p class="muted">${confirming ? "The payment is confirming. Buttons unlock after about 10 blocks." : "Two matching approvals move the money. Each approval is one FROST signature."}</p>
            <div class="decide-actions has-dock">${btns.join("") || '<p class="hint">Nothing for you to do right now.</p>'}</div>
            <p class="error" id="actError" hidden></p><pre class="log" id="jobLog" hidden></pre></section>` : ""}
          ${d.status === "paying_out" ? `<section class="glass decide"><span class="eyebrow space">Paying out</span><h2 class="h-md">Signing and broadcasting</h2><p class="muted">The two signers are producing one FROST signature. Then the transaction is proven and sent to the Zcash network.</p><pre class="log" id="jobLog" hidden></pre></section>` : ""}
          ${d.escrow ? keysPanel(d) : ""}
        </div>
      </div>
      <p class="fineprint">${d.mode === "self" ? "Self-custody deal: your key share lives only in your browser. Aegis holds just the arbiter's share and can't sign without one of you." : "Engine-signed deal: all three FROST signers run in the Aegis escrow engine, which acts only on two matching approvals from different people."} ${d.network === "main" ? "Mainnet beta: real ZEC, unaudited, deals from 0.0002 to 0.00045 ZEC (about $0.26 to $0.60)." : "Testnet: test coins only."} <a href="/docs.html#security">Security model</a></p>`;

    // mobile dock mirrors the decision buttons
    if (btns.length) { dock.innerHTML = btns.slice(0, 2).join(""); dock.hidden = false; dock.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => act(b.dataset.act, b))); }
    else { dock.hidden = true; dock.innerHTML = ""; $(".decide-actions")?.classList.remove("has-dock"); }

    wireCopy();
    if (d.escrow && $("#qr") && window.QRCode && !(d.role === "buyer" && d.mode === "self" && d.status === "awaiting_funds" && !backedUpKey(d))) new QRCode($("#qr"), { text: `zcash:${d.escrow.address}?amount=${price}&message=${encodeURIComponent("Aegis Gate: " + d.title)}`, width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M });
    $("#refresh")?.addEventListener("click", async (e) => {
      e.target.disabled = true; e.target.textContent = "Checking…";
      try { renderDeal(await api(`/api/deals/${d.id}/refresh?t=${tq()}`, { method: "POST" })); toast("Balance updated"); } catch (x) { toast(x.message); e.target.disabled = false; e.target.textContent = "Check now"; }
    });
    $("#addrForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      try { renderDeal(await api(`/api/deals/${d.id}/address?t=${tq()}`, { method: "POST", body: JSON.stringify({ address: $("#f-myaddr").value }) })); toast("Address saved"); }
      catch (x) { const el = $("#addrError"); el.textContent = x.message; el.hidden = false; }
    });
    $("#pasteAddr")?.addEventListener("click", async () => {
      try { const t = (await navigator.clipboard.readText()).trim(); $("#f-myaddr").value = t; toast(t ? "Pasted from clipboard" : "Clipboard is empty"); }
      catch { $("#f-myaddr").focus(); toast("Press Ctrl+V or long-press to paste"); }
    });
    view.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => act(b.dataset.act, b)));
    view.querySelectorAll("[data-step]").forEach((c) => c.addEventListener("change", () => { markStep(d, c.dataset.step, c.checked); renderDeal(d); }));
    if (d.status === "setting_up" && d.setupJob) followJob(d.setupJob);
    if (d.mode === "self" && d.role !== "arbiter") {
      if (d.status === "setting_up" || (signer && signer.inProgress(d.id, d.role))) runCeremony(d);
      if (d.status === "signing" && d.signing && d.signing.mine) runSigning(d);
      const rsb = $("#restartSigning"); if (rsb) rsb.addEventListener("click", () => restartSigning(d));
      if (signer && signer.hasKey(d.id, d.role) && d.keys) {
        signer.securityCode(d.id, d.role, d.keys.boxKeys).then((r) => {
          const el = $("#dealCode"); if (!el || !r) return;
          el.textContent = r.code;
          if (!r.ownIntact) { const w = $("#codeWarn"); w.textContent = "Warning: the key the engine shows for you isn't the one this browser created. Don't pay into this escrow."; w.hidden = false; }
        });
      }
      const doBackup = () => {
        const blob = signer.backupBlob(d.id, d.role); if (!blob) return toast("No key to back up yet");
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `aegis-gate-${d.id}-${d.role}-key.json`; a.click();
        markBackedUp(d); toast("Backup downloaded"); renderDeal(d);
      };
      const bk = $("#backupKey"); if (bk) bk.addEventListener("click", doBackup);
      const ob = $("#onboardBackup"); if (ob) ob.addEventListener("click", doBackup);
      const rk = $("#restoreKey");
      if (rk) rk.addEventListener("change", async (e) => {
        try { await signer.restore(d.id, d.role, e.target.files[0], d.groupKey); toast("Key restored"); load(false); }
        catch (x) { const el = $("#restoreErr"); el.textContent = x.message; el.hidden = false; }
      });
    }
    schedulePoll(d, confirming);
  }

  async function act(action, btn) {
    const d = current, el = $("#actError");
    if (el) el.hidden = true;
    btn.disabled = true; btn.textContent = "Working…";
    try {
      const r = action === "dispute" ? await api(`/api/deals/${d.id}/dispute?t=${tq()}`, { method: "POST" })
        : await api(`/api/deals/${d.id}/approve?t=${tq()}`, { method: "POST", body: JSON.stringify({ action }) });
      renderDeal(r);
      toast(action === "dispute" ? "Dispute opened" : r.job ? "Two approvals match. Paying out." : "Approved. Waiting for one more person.");
      if (r.job) followJob(r.job);
    } catch (x) { if (el) { el.textContent = x.message; el.hidden = false; } else toast(x.message); btn.disabled = false; btn.textContent = "Try again"; }
  }

  async function followJob(id) {
    for (;;) {
      let j; try { j = await api(`/api/jobs/${id}`); } catch { return; }
      const log = $("#jobLog");
      if (log) { log.hidden = false; log.textContent = j.log.split("\n").filter((l) => /^== |group key|TxID|"address"|^[0-9a-f]{64}$|failed/i.test(l)).join("\n").trim() || "Starting…"; }
      if (j.state === "done" || j.state === "failed") {
        if (j.state === "failed") toast("That step failed. The funds are safe in the escrow.");
        return load(false);
      }
      await new Promise((r) => setTimeout(r, 3000));
    }
  }

  function schedulePoll(d, confirming) {
    clearTimeout(pollTimer);
    // Self-custody: once this person has approved (or a signing session is open), keep
    // watching, because this browser must sign when the second approval arrives.
    const mustSign = d.mode === "self" && d.role !== "arbiter" &&
      (d.status === "signing" || ((d.approvals || {})[d.role] && ["funded", "disputed"].includes(d.status)));
    if (mustSign) pollTimer = setTimeout(() => load(false), 4000);
    else if (confirming || d.status === "awaiting_funds") pollTimer = setTimeout(() => load(false, true), 30000);
    else if (["setting_up", "paying_out", "signing"].includes(d.status)) pollTimer = setTimeout(() => load(false), 6000);
  }

  async function load(fresh, refresh) {
    const id = params.get("id");
    try {
      const [d] = await Promise.all([api(`/api/deals/${id}?t=${tq()}`), signer ? null : useSigner().catch(() => null)]);
      renderDeal(d, fresh);
      if (refresh && d.escrow && !CLOSED.includes(d.status)) {
        // A chain sync can take several seconds (longer on mainnet); the page is already usable.
        api(`/api/deals/${id}/refresh?t=${tq()}`, { method: "POST" })
          .then((r) => { if (current && current.id === r.id && current.status === r.status && !document.querySelector("form:focus-within")) renderDeal(r, fresh); })
          .catch(() => {});
      }
    } catch (x) {
      dock.hidden = true;
      view.innerHTML = `<section class="glass block"><h1 class="h-lg">Can't open this deal</h1><p class="muted">${esc(x.message)}</p><div class="row-actions"><button class="btn primary" id="again">Start a new escrow</button></div></section>`;
      $("#again").addEventListener("click", openSheet);
    }
  }

  // ---------- empty state + operator ----------
  function renderHome() {
    document.body.dataset.space = "seller"; dock.hidden = true;
    view.innerHTML = `<section class="glass space-head"><span class="eyebrow space">New escrow</span><h1 class="h-lg">Sell something. Get paid safely.</h1>
      <p class="lede">Describe the deal and where you want to be paid. Aegis Gate makes a 2-of-3 shielded escrow and a private link for your buyer.</p>
      <div class="row-actions"><button class="btn space" id="start">Open the composer <kbd>⌘K</kbd></button><a class="btn" href="/docs.html#quickstart">How it works</a></div></section>`;
    $("#start").addEventListener("click", openSheet);
    if (params.get("compose") !== "0") openSheet();
  }

  async function renderAdmin() {
    document.body.dataset.space = "arbiter"; dock.hidden = true;
    try {
      const { deals } = await api(`/api/admin/deals?key=${encodeURIComponent(params.get("admin"))}`);
      view.innerHTML = `<section class="glass space-head"><span class="role-badge"><i>A</i>Arbiter desk</span><h1 class="h-lg">Deals</h1><p class="muted">Open a deal as the arbiter. You can sign only after the buyer or seller opens a dispute.</p></section>
        <section class="glass" style="padding:6px 0">${deals.length ? deals.map((x) => `<a class="list-row" href="${dealLink(x.id, x.arbiter)}"><span><b>${esc(x.title)}</b><br><span class="faint" style="font-size:.82rem">${x.priceZec} ZEC · ${esc(x.id)}</span></span><span class="status" data-tone="${(STATUS[x.status] || [0, "wait"])[1]}">${(STATUS[x.status] || [x.status])[0]}</span><span aria-hidden="true">→</span></a>`).join("") : '<p class="block muted">No deals yet.</p>'}</section>`;
    } catch (x) { view.innerHTML = `<section class="glass block"><h1 class="h-lg">Arbiter desk</h1><p class="muted">${esc(x.message)}</p></section>`; }
  }

  async function route() {
    [...params.keys()].forEach((k) => params.delete(k));
    new URLSearchParams(location.search).forEach((v, k) => params.set(k, v));
    clearTimeout(pollTimer);
    if (params.get("id") && !signer) useSigner().catch(() => null); // load while the engine is checked
    if (!(await checkEngine())) {
      dock.hidden = true;
      view.innerHTML = `<section class="glass block"><span class="eyebrow">Reconnecting</span><h1 class="h-lg">One moment.</h1><p class="muted">The escrow engine is restarting or your connection dropped. Your funds are safe on the Zcash network. This page reconnects on its own.</p><p class="faint" id="retryNote">Trying again in 10 seconds…</p></section>`;
      let n = 10; const iv = setInterval(() => { n--; const el = $("#retryNote"); if (el) el.textContent = `Trying again in ${n} seconds…`; if (n <= 0) { clearInterval(iv); route(); } }, 1000);
      return;
    }
    if (params.get("admin")) return renderAdmin();
    if (params.get("id") && params.get("t")) return load(params.get("new") === "1", true);
    renderHome();
  }
  addEventListener("popstate", route);
  route();
})();
</script>
</body>
</html>
